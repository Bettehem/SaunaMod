[Comfort]

## Enables conditional sauna comfort. Whisks, bucket and towel rack each add +1 comfort only near a sauna stove with hot stones while sheltered.
# Setting type: Boolean
# Default value: true
EnableSaunaComfort = true

[Gameplay]

## Seconds of accumulated contact with sauna steam required to gain or advance Well Steamed.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 1 to 300
SecondsToWellSteamed = 20

## Health restored per second while the player is physically inside sauna steam. Set to 0 to disable healing.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 10
SteamHealPerSecond = 0.5

## Radius in metres used to detect whether the player is touching a sauna steam cloud.
# Setting type: Single
# Default value: 0.6
# Acceptable value range: From 0.1 to 5
SteamDetectionRadius = 0.6

## How long a short gap between steam clouds may last without resetting steaming progress.
# Setting type: Single
# Default value: 3
# Acceptable value range: From 0 to 20
SteamContactGraceSeconds = 3

## If enabled, holding a weapon, bow or shield while steaming also triggers the Too hot status effect, like wearing clothes.
# Setting type: Boolean
# Default value: true
TooHotWeapons = true

[General]

## Enables the in-game SaunaMod live editor. Press F7 to open it. Intended for testing and tuning.
# Setting type: Boolean
# Default value: false
EnableEditor = true

[Mead]

## Multiplier applied to the normal duration of resistance mead distributed through the sauna bucket.
# Setting type: Single
# Default value: 1.2
# Acceptable value range: From 0.1 to 5
DurationMultiplier = 1.2

[Recipes]

## Crafting recipe for the sauna stove. Format: ItemPrefab:Amount,ItemPrefab:Amount. Example: Wood:10,Coal:5,Stone:40.
# Setting type: String
# Default value: Wood:10,Coal:5,Stone:40
SaunaStove = Wood:10,Coal:5,Stone:40

## Crafting recipe for the sauna whisks. Format: ItemPrefab:Amount,ItemPrefab:Amount. Example: FineWood:5,BronzeNails:1.
# Setting type: String
# Default value: FineWood:5,BronzeNails:1
SaunaWhisks = FineWood:5,BronzeNails:1

## Crafting recipe for the sauna bucket. Format: ItemPrefab:Amount,ItemPrefab:Amount. Example: Iron:5,FineWood:10.
# Setting type: String
# Default value: Iron:5,FineWood:10
SaunaBucket = Iron:5,FineWood:10

## Crafting recipe for the sauna towel rack. Format: ItemPrefab:Amount,ItemPrefab:Amount. Example: FineWood:5,WolfPelt:5.
# Setting type: String
# Default value: FineWood:5,WolfPelt:5
SaunaTowelRack = FineWood:5,WolfPelt:5

[Steam]

## Lifetime of a sauna steam cloud before it begins to fade.
# Setting type: Single
# Default value: 40
# Acceptable value range: From 25 to 180
CloudLifetimeSeconds = 40

## Time a steam cloud takes to fade after its lifetime ends.
# Setting type: Single
# Default value: 4.4
# Acceptable value range: From 0.1 to 30
CloudFadeSeconds = 4.4

## Horizontal target speed of steam clouds.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0 to 10
HorizontalSpread = 1

## Vertical target speed of steam clouds.
# Setting type: Single
# Default value: 1.45
# Acceptable value range: From 0 to 10
RiseSpeed = 1.45

## How quickly steam accelerates toward its target movement.
# Setting type: Single
# Default value: 0.25
# Acceptable value range: From 0 to 10
MovementForce = 0.25

## How strongly overlapping steam clouds separate from each other.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 10
CloudPush = 0.5

## Physical size of each steam cloud. This mainly affects distribution and detection, not the smoke sprite itself.
# Setting type: Single
# Default value: 2.9
# Acceptable value range: From 0.1 to 10
CloudSize = 2.9

## Number of steam clouds created by a normal pour.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 1 to 200
CloudsPerPour = 30

## Number of steam clouds created when the sauna has the bucket upgrade.
# Setting type: Int32
# Default value: 50
# Acceptable value range: From 1 to 200
CloudsPerPourWithBucket = 50

## Global smoke/steam cloud cap used by SaunaMod. Very high values may be visually wasteful or affect performance.
# Setting type: Int32
# Default value: 100
# Acceptable value range: From 10 to 1000
MaxClouds = 100

[Stove]

## How much wood the sauna stove holds. One piece burns for 60 seconds.
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 1 to 50
MaxWood = 5

## How fast the stove stones heat up and how much heat a pour spends. Standard: 20 heat per minute (0 to 100 in 5 minutes), a pour costs 20. Fast: 30 heat per minute (0 to 100 in 3 min 20 s), a pour costs 15.
# Setting type: HeatingSpeed
# Default value: Standard
# Acceptable values: Standard, Fast
HeatingSpeed = Standard

## Highest stone heat. Pouring needs at least 50 heat, so a higher maximum gives more pours from one full heat-up, but the stones also take longer to get there.
# Setting type: Single
# Default value: 100
# Acceptable value range: From 60 to 1000
MaxHeat = 100

## Stone heat lost per minute once the stones start cooling. 5 cools 100 heat down to 0 in 20 minutes.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0 to 100
CoolPerMinute = 5

## Seconds the stones keep their heat after the fire goes out before they start cooling.
# Setting type: Single
# Default value: 60
# Acceptable value range: From 0 to 3600
CoolingDelaySeconds = 60

## If enabled, cooler stones give less steam per pour: the full amount at max heat, falling linearly towards half at 0 heat. If disabled, every pour gives the full amount.
# Setting type: Boolean
# Default value: true
SteamDependsOnHeat = true

## How brightly the hot stove stones redden, glow and light the sauna. Dim halves redness, glow and light brightness.
# Setting type: StoveGlow
# Default value: Standard
# Acceptable values: Standard, Dim
Glow = Standard

## If enabled, the stove hover text shows the current stone heat.
# Setting type: Boolean
# Default value: false
ShowHeatOnHover = false

PourCost = 20

[TowelRack]

## Experimental. If enabled, Well steamed earned in a tier 4 sauna (stove + whisks + bucket + towel rack) helps on slopes and against Freezing, as set below.
# Setting type: Boolean
# Default value: true
Tier4Bonuses = true

## Degrees added to the steepest slope you can stand on without slipping (vanilla 38).
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 52
SlideAngleBonus = 10

## How fast you start slipping on a slope that is still too steep. Vanilla is 1; lower slips more slowly.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 2
SlipSpeed = 0.5

## Stamina used for running uphill and jumping on slopes, as a share of normal. 0.7 = 30% less.
# Setting type: Single
# Default value: 0.7
# Acceptable value range: From 0 to 1
ClimbStaminaMultiplier = 0.7

## Ground angle in degrees from which the climbing stamina bonus applies.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 0 to 90
ClimbMinSlope = 20

## Damage taken from Freezing, as a share of normal. 0.5 = half damage.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0 to 1
FreezingDamageMultiplier = 0.5

[WellSteamed]

## Duration of the first Well Steamed time tier in minutes.
# Setting type: Single
# Default value: 5
# Acceptable value range: From 0.5 to 120
Tier1DurationMinutes = 5

## Duration of the second Well Steamed time tier in minutes.
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0.5 to 120
Tier2DurationMinutes = 10

## Duration of the third Well Steamed time tier in minutes. This tier requires sauna whisks.
# Setting type: Single
# Default value: 15
# Acceptable value range: From 0.5 to 120
Tier3DurationMinutes = 15

